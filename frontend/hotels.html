<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotels - HotelOS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/utilities.css">
    <link rel="stylesheet" href="css/hotels.css">
</head>
<body>
    <!-- Animated Background -->
    <div class="bg-animation">
        <div class="bg-circle"></div>
        <div class="bg-circle"></div>
        <div class="bg-circle"></div>
    </div>

    <!-- Particle Effect -->
    <div class="particles" id="particles"></div>

    <!-- Preloader -->
    <div id="preloader">
        <div class="preloader-content">
            <div class="loader"></div>
            <div class="loader-content">
                <h3>HotelOS Admin</h3>
                <p>Loading hotel management system...</p>
            </div>
        </div>
    </div>

    <!-- Container -->
    <div class="admin-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="fas fa-shield-alt"></i>
                </div>
                <h2>HotelOS</h2>
                <button class="sidebar-collapse-btn" id="desktopSidebarToggle">
                    <i class="fas fa-chevron-left"></i>
                </button>
            </div>

            <nav class="sidebar-nav">
                <!-- Navigation items generated dynamically by main.js -->
            </nav>

            <div class="sidebar-footer">
                <div class="profile-mini">
                    <img src="" alt="Admin" class="profile-avatar">
                    <div class="profile-info">
                        <p class="profile-name" id="user">Admin</p>
                        <p class="profile-role">Administrator</p>
                    </div>
                </div>
                <button class="logout-btn">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <div class="main-wrapper">
            <!-- Top Header -->
            <header class="top-header">
                <div class="header-left">
                    <button class="sidebar-toggle" id="mobileSidebarToggle">
                        <i class="fas fa-bars"></i>
                    </button>
                    <div class="breadcrumb-wrapper">
                        <span>Hotels</span>
                    </div>
                </div>

                <div class="header-right">
                    <button class="notification-btn">
                        <i class="fas fa-bell"></i>
                        <span class="notification-badge">3</span>
                    </button>
                    <button class="theme-toggle" id="themeToggle">
                        <i class="fas fa-moon"></i>
                    </button>
                </div>
            </header>

            <!-- Main Content -->
            <main class="main-content">
                <!-- Welcome Section -->
                <div class="welcome-section">
                    <h1>Hotel Management 🏨</h1>
                    <p>Manage your hotel information and settings</p>
                </div>

                <!-- Hotel Information Card -->
                <div class="card full-width">
                    <div class="card-header">
                        <h2>Hotel Details</h2>
                        <button class="action-btn" id="updateBtn" style="padding: 0.6rem 1.2rem; gap: 0.5rem;">
                            <i class="fas fa-edit"></i>
                            <span>Update</span>
                        </button>
                    </div>
                    <div class="card-body">
                        <div id="viewMode" class="hotel-info-display">
                            <div class="info-section">
                                <h3>Basic Information</h3>
                                <div class="info-grid">
                                    <div class="info-item">
                                        <label>Hotel Name</label>
                                        <p id="hotelName">-</p>
                                    </div>
                                    <div class="info-item">
                                        <label>ID Number</label>
                                        <p id="idNumber">-</p>
                                    </div>
                                    <div class="info-item">
                                        <label>Phone</label>
                                        <p id="phone">-</p>
                                    </div>
                                    <div class="info-item">
                                        <label>Email</label>
                                        <p id="email">-</p>
                                    </div>
                                </div>
                            </div>

                            <div class="info-section">
                                <h3>Location</h3>
                                <div class="info-grid">
                                    <div class="info-item full-width">
                                        <label>Address</label>
                                        <p id="address">-</p>
                                    </div>
                                    <div class="info-item">
                                        <label>City</label>
                                        <p id="city">-</p>
                                    </div>
                                    <div class="info-item">
                                        <label>Country</label>
                                        <p id="country">-</p>
                                    </div>
                                    <div class="info-item">
                                        <label>Postal Code</label>
                                        <p id="postalCode">-</p>
                                    </div>
                                </div>
                            </div>

                            <div class="info-section">
                                <h3>Operating Hours</h3>
                                <div class="info-grid">
                                    <div class="info-item">
                                        <label>Check-in Time</label>
                                        <p id="checkInTime">-</p>
                                    </div>
                                    <div class="info-item">
                                        <label>Check-out Time</label>
                                        <p id="checkOutTime">-</p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Edit Mode Form -->
                        <div id="editMode" class="hotel-info-form" style="display: none;">
                            <form id="hotelForm">
                                <div class="form-section">
                                    <h3>Basic Information</h3>
                                    <div class="form-grid">
                                        <div class="form-group">
                                            <label for="hotelNameInput">Hotel Name *</label>
                                            <input type="text" id="hotelNameInput" required>
                                        </div>
                                        <div class="form-group">
                                            <label for="idNumberInput">ID Number</label>
                                            <input type="text" id="idNumberInput" readonly>
                                        </div>
                                        <div class="form-group">
                                            <label for="phoneInput">Phone</label>
                                            <input type="tel" id="phoneInput">
                                        </div>
                                        <div class="form-group">
                                            <label for="emailInput">Email</label>
                                            <input type="email" id="emailInput">
                                        </div>
                                    </div>
                                </div>

                                <div class="form-section">
                                    <h3>Location</h3>
                                    <div class="form-grid">
                                        <div class="form-group full-width">
                                            <label for="addressInput">Address *</label>
                                            <textarea id="addressInput" rows="3" required></textarea>
                                        </div>
                                        <div class="form-group">
                                            <label for="cityInput">City</label>
                                            <input type="text" id="cityInput">
                                        </div>
                                        <div class="form-group">
                                            <label for="countryInput">Country</label>
                                            <input type="text" id="countryInput">
                                        </div>
                                        <div class="form-group">
                                            <label for="postalCodeInput">Postal Code</label>
                                            <input type="text" id="postalCodeInput">
                                        </div>
                                    </div>
                                </div>

                                <div class="form-section">
                                    <h3>Operating Hours</h3>
                                    <div class="form-grid">
                                        <div class="form-group">
                                            <label for="checkInTimeInput">Check-in Time</label>
                                            <input type="time" id="checkInTimeInput">
                                        </div>
                                        <div class="form-group">
                                            <label for="checkOutTimeInput">Check-out Time</label>
                                            <input type="time" id="checkOutTimeInput">
                                        </div>
                                    </div>
                                </div>

                                <div class="form-actions">
                                    <button type="submit" class="action-btn">
                                        <i class="fas fa-save"></i>
                                        <span>Save Changes</span>
                                    </button>
                                    <button type="button" id="cancelBtn" class="action-btn" style="background: rgba(110, 68, 255, 0.1); color: var(--primary);">
                                        <i class="fas fa-times"></i>
                                        <span>Cancel</span>
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="js/main.js"></script>
    <script src="js/hotels.js"></script>
</body>
</html>
