<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payments - HotelOS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/payments.css">
</head>
<body>
    <div class="bg-animation">
        <div class="bg-circle"></div>
        <div class="bg-circle"></div>
        <div class="bg-circle"></div>
    </div>
    <div class="particles" id="particles"></div>
    <div id="preloader">
        <div class="preloader-content">
            <div class="loader"></div>
            <div class="loader-content">
                <h3>HotelOS Admin</h3>
                <p>Loading hotel management system...</p>
            </div>
        </div>
    </div>
    <div class="admin-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="fas fa-shield-alt"></i>
                </div>
                <h2>HotelOS</h2>
                <button class="sidebar-collapse-btn" id="desktopSidebarToggle">
                    <i class="fas fa-chevron-left"></i>
                </button>
            </div>
            <nav class="sidebar-nav"></nav>
            <div class="sidebar-footer">
                <div class="profile-mini">
                    <img src="" alt="Admin" class="profile-avatar">
                    <div class="profile-info">
                        <p class="profile-name" id="user">Admin</p>
                        <p class="profile-role">Administrator</p>
                    </div>
                </div>
                <button class="logout-btn">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </aside>
        <div class="main-wrapper">
            <header class="top-header">
                <div class="header-left">
                    <button class="sidebar-toggle" id="mobileSidebarToggle">
                        <i class="fas fa-bars"></i>
                    </button>
                    <div class="breadcrumb-wrapper">
                        <span>Payments</span>
                    </div>
                </div>
                <div class="header-right">
                    <button class="notification-btn">
                        <i class="fas fa-bell"></i>
                        <span class="notification-badge">3</span>
                    </button>
                    <button class="theme-toggle" id="themeToggle">
                        <i class="fas fa-moon"></i>
                    </button>
                </div>
            </header>
            <main class="main-content">
                <div class="welcome-section">
                    <h1>Payments Management 💳</h1>
                    <p>Manage all payments and transactions</p>
                </div>
                <div class="card full-width">
                    <div class="card-header">
                        <h2>All Payments</h2>
                        <div class="card-header-actions">
                            <div class="search-box-inline">
                                <i class="fas fa-search"></i>
                                <input type="text" id="paymentSearchInput" placeholder="Search by invoice, transaction ID, or method...">
                            </div>
                            <button class="action-btn create-payment-btn" id="createPaymentBtn" style="padding: 0.6rem 1.2rem; gap: 0.5rem;">
                                <i class="fas fa-plus-circle"></i>
                                <span>Record Payment</span>
                            </button>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="payments-list" id="paymentsContainer">
                            <div style="text-align: center; padding: 2rem; color: #666;">Loading payments...</div>
                        </div>
                    </div>
                </div>
            </main>

            <!-- Create/Edit Payment Modal -->
            <div class="modal" id="paymentModal">
                <div class="modal-content modal-large">
                    <div class="modal-header">
                        <h2 id="modalTitle">Create New Payment</h2>
                        <button class="modal-close" id="closePaymentModal">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    <div class="modal-body">
                        <form id="paymentForm">
                            <div class="form-group">
                                <label for="invoiceSelect">Invoice *</label>
                                <select id="invoiceSelect" name="invoice" required>
                                    <option value="">Select an invoice</option>
                                </select>
                            </div>
                            <div class="form-group" id="statusGroup" style="display: none;">
                                <label for="paymentStatus">Payment Status *</label>
                                <select id="paymentStatus" name="payment_status">
                                    <option value="PENDING">Pending</option>
                                    <option value="COMPLETED">Completed</option>
                                    <option value="FAILED">Failed</option>
                                </select>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-secondary" id="cancelPaymentBtn">Cancel</button>
                        <button class="btn btn-primary" id="savePaymentBtn">Save Payment</button>
                    </div>
                </div>
            </div>

            <!-- Delete Confirmation Modal -->
            <div class="modal" id="deletePaymentModal">
                <div class="modal-content modal-small">
                    <div class="modal-header">
                        <h2>Delete Payment</h2>
                        <button class="modal-close" id="closeDeleteModal">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    <div class="modal-body">
                        <p id="deleteMessage">Are you sure you want to delete this payment?</p>
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-secondary" id="cancelDeleteBtn">Cancel</button>
                        <button class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="js/main.js"></script>
    <script src="js/payments.js"></script>
</body>
</html>
