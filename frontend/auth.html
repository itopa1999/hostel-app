<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Management System - HotelOS Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/utilities.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <!-- Animated Background -->
    <div class="bg-animation">
        <div class="bg-circle"></div>
        <div class="bg-circle"></div>
        <div class="bg-circle"></div>
    </div>

    <!-- Particle Effect -->
    <div class="particles" id="particles"></div>

    <!-- Preloader -->
    <div id="preloader">
        <div class="preloader-content">
            <div class="loader"></div>
            <div class="loader-content">
                <h3>HotelOS Portal</h3>
                <p>Loading hotel management system...</p>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <main class="main-content">

        <section class="auth-section">
            <div class="auth-container">
                <div class="auth-card">
                    <div class="auth-header">
                        <i class="fas fa-hotel auth-icon"></i>
                        <h1 class="auth-title">HotelOS</h1>
                        <p class="auth-subtitle">Sign in to Hotel Management</p>
                    </div>

                    <form id="loginForm">
                        <div class="form-group">
                            <div class="input-wrapper">
                                <div class="input-icon">
                                    <i class="fas fa-user"></i>
                                </div>
                                <input type="text" id="username" class="form-input" placeholder="Enter your username" required>
                            </div>
                            <div id="username-error" class="error-message" style="display: none;">
                                <i class="fas fa-exclamation-circle"></i> Please enter a valid username
                            </div>
                        </div>

                        <div class="form-group">
                            <div class="input-wrapper">
                                <div class="input-icon">
                                    <i class="fas fa-lock"></i>
                                </div>
                                <input type="password" id="password" class="form-input" placeholder="Enter your password" required>
                            </div>
                            <div id="password-error" class="error-message" style="display: none;">
                                <i class="fas fa-exclamation-circle"></i> Password must be at least 6 characters
                            </div>
                        </div>

                        <div class="form-group">
                            <div class="input-wrapper">
                                <div class="input-icon">
                                    <i class="fas fa-user-tag"></i>
                                </div>
                                <select id="role" class="form-input form-select" required>
                                    <option value="" disabled selected>Select your role</option>
                                    
                                </select>
                            </div>
                            <div id="role-error" class="error-message" style="display: none;">
                                <i class="fas fa-exclamation-circle"></i> Please select your role
                            </div>
                        </div>

                        <button type="submit" class="auth-button">
                            <i class="fas fa-sign-in-alt"></i>
                            <span>Access HotelOS Portal</span>
                        </button>

                    </form>

                    
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-content">
            <div class="footer-text">
                &copy; 2026 HotelOS. All rights reserved. | Hotel Management System v1.0
            </div>
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
