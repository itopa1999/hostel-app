<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff - HotelOS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/staff.css">
</head>
<body>
    <div class="bg-animation">
        <div class="bg-circle"></div>
        <div class="bg-circle"></div>
        <div class="bg-circle"></div>
    </div>
    <div class="particles" id="particles"></div>
    <div id="preloader">
        <div class="preloader-content">
            <div class="loader"></div>
            <div class="loader-content">
                <h3>HotelOS Admin</h3>
                <p>Loading hotel management system...</p>
            </div>
        </div>
    </div>
    <div class="admin-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="fas fa-shield-alt"></i>
                </div>
                <h2>HotelOS</h2>
                <button class="sidebar-collapse-btn" id="desktopSidebarToggle">
                    <i class="fas fa-chevron-left"></i>
                </button>
            </div>
            <nav class="sidebar-nav"></nav>
            <div class="sidebar-footer">
                <div class="profile-mini">
                    <img src="" alt="Admin" class="profile-avatar">
                    <div class="profile-info">
                        <p class="profile-name" id="user">Admin</p>
                        <p class="profile-role">Administrator</p>
                    </div>
                </div>
                <button class="logout-btn">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </aside>
        <div class="main-wrapper">
            <header class="top-header">
                <div class="header-left">
                    <button class="sidebar-toggle" id="mobileSidebarToggle">
                        <i class="fas fa-bars"></i>
                    </button>
                    <div class="breadcrumb-wrapper">
                        <span>Staff</span>
                    </div>
                </div>
                <div class="header-right">
                    <button class="notification-btn">
                        <i class="fas fa-bell"></i>
                        <span class="notification-badge">3</span>
                    </button>
                    <button class="theme-toggle" id="themeToggle">
                        <i class="fas fa-moon"></i>
                    </button>
                </div>
            </header>
            <main class="main-content">
                <div class="welcome-section">
                    <h1>Staff Management 👨‍💼</h1>
                    <p>Manage staff members and their roles</p>
                </div>
                <div class="card full-width">
                    <div class="card-header">
                        <h2>All Staff</h2>
                        <div class="card-header-actions">
                            <div class="search-box-inline">
                                <i class="fas fa-search"></i>
                                <input type="text" id="staffSearchInput" placeholder="Search staff by name, email, phone...">
                            </div>
                            <button class="action-btn create-staff-btn" style="padding: 0.6rem 1.2rem; gap: 0.5rem;" id="addStaffBtn">
                                <i class="fas fa-plus-circle"></i>
                                <span>Add Staff</span>
                            </button>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="staff-container" id="staffContainer">
                            <div style="text-align: center; padding: 2rem; color: #666;">Loading staff...</div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Change Group Modal -->
    <div class="modal" id="changeGroupModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Manage Groups</h2>
                <button class="modal-close" id="closeChangeGroupModal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <!-- Content will be populated by JavaScript -->
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="cancelChangeGroupBtn">Cancel</button>
                <button class="btn btn-primary" id="saveChangeGroupBtn">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- Create Staff Modal -->
    <div class="modal" id="createStaffModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Add New Staff Member</h2>
                <button class="modal-close" id="closeCreateStaffModal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <form id="createStaffForm">
                    <div class="form-group">
                        <label for="username">Username *</label>
                        <input type="text" id="username" name="username" required class="form-control">
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" class="form-control">
                    </div>
                    <div class="form-group">
                        <label for="password">Password *</label>
                        <input type="password" id="password" name="password" required class="form-control">
                    </div>
                    <div class="form-group">
                        <label for="firstName">First Name</label>
                        <input type="text" id="firstName" name="first_name" class="form-control">
                    </div>
                    <div class="form-group">
                        <label for="lastName">Last Name</label>
                        <input type="text" id="lastName" name="last_name" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Groups</label>
                        <div id="groupCheckboxes"></div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="closeCreateBtn">Cancel</button>
                <button class="btn btn-primary" id="saveStaffBtn">Create Staff</button>
            </div>
        </div>
    </div>

    <!-- Delete Staff Modal -->
    <div class="modal" id="deleteStaffModal">
        <div class="modal-content modal-small">
            <div class="modal-header">
                <h2>Delete Staff</h2>
                <button class="modal-close" id="closeDeleteModal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <p id="deleteMessage">Are you sure you want to delete this staff member?</p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="cancelDeleteBtn">Cancel</button>
                <button class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script src="js/staff.js"></script>
</body>
</html>
