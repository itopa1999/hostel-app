<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - HotelOS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/utilities.css">
</head>
<body>
    <div class="bg-animation">
        <div class="bg-circle"></div>
        <div class="bg-circle"></div>
        <div class="bg-circle"></div>
    </div>
    <div class="particles" id="particles"></div>
    <div id="preloader">
        <div class="preloader-content">
            <div class="loader"></div>
            <div class="loader-content">
                <h3>HotelOS Admin</h3>
                <p>Loading hotel management system...</p>
            </div>
        </div>
    </div>
    <div class="admin-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="fas fa-shield-alt"></i>
                </div>
                <h2>HotelOS</h2>
                <button class="sidebar-collapse-btn" id="desktopSidebarToggle">
                    <i class="fas fa-chevron-left"></i>
                </button>
            </div>
            <nav class="sidebar-nav"></nav>
            <div class="sidebar-footer">
                <div class="profile-mini">
                    <img src="" alt="Admin" class="profile-avatar">
                    <div class="profile-info">
                        <p class="profile-name" id="user">Admin</p>
                        <p class="profile-role">Administrator</p>
                    </div>
                </div>
                <button class="logout-btn">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </aside>
        <div class="main-wrapper">
            <header class="top-header">
                <div class="header-left">
                    <button class="sidebar-toggle" id="mobileSidebarToggle">
                        <i class="fas fa-bars"></i>
                    </button>
                    <div class="breadcrumb-wrapper">
                        <span>Settings</span>
                    </div>
                </div>
                <div class="header-right">
                    <button class="notification-btn">
                        <i class="fas fa-bell"></i>
                        <span class="notification-badge">3</span>
                    </button>
                    <button class="theme-toggle" id="themeToggle">
                        <i class="fas fa-moon"></i>
                    </button>
                </div>
            </header>
            <main class="main-content">
                <div class="welcome-section">
                    <h1>Settings ⚙️</h1>
                    <p>Manage system and account settings</p>
                </div>
                <div class="dashboard-grid">
                    <div class="left-column">
                        <div class="card">
                            <div class="card-header">
                                <h2>Account Settings</h2>
                            </div>
                            <div class="card-body">
                                <div class="action-buttons">
                                    <button class="action-btn">
                                        <i class="fas fa-user-circle"></i>
                                        <span>Profile Settings</span>
                                    </button>
                                    <button class="action-btn">
                                        <i class="fas fa-lock"></i>
                                        <span>Change Password</span>
                                    </button>
                                    <button class="action-btn">
                                        <i class="fas fa-bell"></i>
                                        <span>Notifications</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="right-column">
                        <div class="card">
                            <div class="card-header">
                                <h2>System Settings</h2>
                            </div>
                            <div class="card-body">
                                <div class="action-buttons">
                                    <button class="action-btn">
                                        <i class="fas fa-cog"></i>
                                        <span>General Settings</span>
                                    </button>
                                    <button class="action-btn">
                                        <i class="fas fa-database"></i>
                                        <span>Backup & Restore</span>
                                    </button>
                                    <button class="action-btn">
                                        <i class="fas fa-info-circle"></i>
                                        <span>System Information</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="js/main.js"></script>
    <script src="js/settings.js"></script>
</body>
</html>
